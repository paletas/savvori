name: Build

on:
  pull_request:
  push:
    branches: [develop, main]
  workflow_dispatch:   # run manually against any branch to publish a branch-tagged image

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/Savvori.WebApp/package-lock.json
      - run: npm ci
        working-directory: src/Savvori.WebApp
      # LiveScraperTests hit real store websites and are excluded from CI.
      - run: dotnet test Savvori.sln -c Release -- --filter-not-trait "Category=Live"

  image:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: webapi
            dockerfile: Dockerfile.webapi
          - name: webapp
            dockerfile: Dockerfile.webapp
    steps:
      - uses: actions/checkout@v7
      - name: Compute tags
        id: tags
        env:
          REPO: ${{ github.repository }}
          PUBLISH: ${{ github.event_name != 'pull_request' }}
        run: |
          image="ghcr.io/${REPO,,}-${{ matrix.name }}"
          short="${GITHUB_SHA::7}"
          ref="${GITHUB_REF_NAME}"
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            slug=$(echo "$ref" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9._-]/-/g')
            tags="$image:branch-$slug,$image:branch-$slug-$short"
          elif [[ "$ref" == "main" ]]; then
            tags="$image:latest,$image:sha-$short"
          else
            tags="$image:beta,$image:beta-$short"
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # On PRs the image is built (to catch Dockerfile breakage) but not pushed.
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}


  # Gate for every PR and push: build both production images, start the API and the web app together (empty
  # /data, no scraping, no model) and require real answers. `test` + `smoke` are the required checks.
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Build the production images
        run: |
          docker build -f Dockerfile.webapi -t savvori-api:smoke .
          docker build -f Dockerfile.webapp -t savvori-web:smoke .
      - name: Start both and probe
        run: |
          docker network create smoke
          docker run -d --name api --network smoke -p 8091:8080 -e ASPNETCORE_ENVIRONMENT=Production \
            -e Model__Enabled=false savvori-api:smoke
          docker run -d --name web --network smoke -p 8081:8080 -e ASPNETCORE_ENVIRONMENT=Production \
            -e services__webapi__http__0=http://api:8080 savvori-web:smoke
          for i in $(seq 1 40); do curl -fs -o /dev/null http://localhost:8091/api/stores && curl -fs -o /dev/null http://localhost:8081/ && break; sleep 2; done
          fail=0
          for u in 8091/api/stores 8091/api/products 8081/ 8081/Products 8081/Stores 8081/Categories 8081/ShoppingLists; do
            code=$(curl -s -o /tmp/body -w '%{http_code}' "http://localhost:$u" || true)
            echo "GET $u -> $code ($(wc -c < /tmp/body) bytes)"
            [ "$code" = 200 ] || fail=1
          done
          hx=$(curl -s -o /tmp/htmx.js -w '%{http_code}' http://localhost:8081/lib/htmx.min.js || true)
          echo "GET 8081/lib/htmx.min.js -> $hx ($(wc -c < /tmp/htmx.js) bytes)"
          { [ "$hx" = 200 ] && [ "$(wc -c < /tmp/htmx.js)" -gt 10000 ]; } || { echo "htmx is not served by the image"; fail=1; }
          [ "$(curl -s http://localhost:8081/Products | wc -c)" -gt 5000 ] || { echo "Products page suspiciously small"; fail=1; }
          exit $fail
      - name: Container logs
        if: failure()
        run: docker logs api || true; docker logs web || true
