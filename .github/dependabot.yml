# Private (LAN/tailnet) app: Dependabot version updates once a week (Monday 06:00 Lisbon). PRs go to develop; minor/patch grouped per ecosystem.
# Security fixes are raised by Dependabot separately and are not limited by this schedule.
version: 2
updates:
  - package-ecosystem: nuget
    directories: ["/src/*", "/tests/*"]
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Lisbon
    open-pull-requests-limit: 5
    ignore:
      # Quartz 4 fails the gate (needs a migration); revisit deliberately.
      - dependency-name: "Quartz*"
        update-types: ["version-update:semver-major"]
    groups:
      nuget-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: "/src/Savvori.WebApp"
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Lisbon
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: dotnet-sdk
    directory: "/"
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Lisbon
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: "/"
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Lisbon
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: "/"
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Lisbon
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
